find-process-mode: strict
ipv6: false
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - +.push.apple.com
proxies: []
proxy-providers:
  front:
    type: http
    url: https://gcore.jsdelivr.net/gh/hoooou/my_yml@main/%E5%89%8D%E7%BD%AE%E9%85%8D%E7%BD%AE.yaml
    interval: 3600
    path: ./providers/front.yaml
    proxy: DIRECT
  landing:
    type: http
    url: https://gcore.jsdelivr.net/gh/hoooou/my_yml@main/%E5%90%8E%E7%BD%AE%E9%85%8D%E7%BD%AE.yaml
    interval: 3600
    path: ./providers/landing.yaml
    proxy: DIRECT
    override:
      dialer-proxy: 🌉 前置
proxy-groups:
- name: 🌉 前置
  type: select
  proxies:
  - 🔄 自动前置
  use:
  - front
- name: 🔄 自动前置
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 180
  timeout: 5000
  expected-status: 204
  tolerance: 30
  lazy: false
  use:
  - front
- name: 🚀 全局选择
  type: select
  proxies:
  - 🇺🇸 美国节点
  - 🏢 美国机房
  - 🏠 美国住宅
  - 🇯🇵 日本
  - 🇸🇬 新加坡
  - 🇪🇺 欧洲
  - 🌐 全部节点
  - DIRECT
- name: 🇺🇸 美国节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 180
  timeout: 5000
  expected-status: 204
  tolerance: 50
  lazy: false
  use:
  - landing
  filter: ^美国
- name: 🏢 美国机房
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 180
  timeout: 5000
  expected-status: 204
  tolerance: 50
  lazy: false
  use:
  - landing
  filter: ^美国.*[|]机房[|]
- name: 🏠 美国住宅
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 180
  timeout: 5000
  expected-status: 204
  tolerance: 50
  lazy: false
  use:
  - landing
  filter: ^美国.*[|]住宅[|]
- name: 🇯🇵 日本
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 180
  timeout: 5000
  expected-status: 204
  tolerance: 50
  lazy: false
  use:
  - landing
  filter: ^日本
- name: 🇸🇬 新加坡
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 180
  timeout: 5000
  expected-status: 204
  tolerance: 50
  lazy: false
  use:
  - landing
  filter: ^新加坡
- name: 🇪🇺 欧洲
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 180
  timeout: 5000
  expected-status: 204
  tolerance: 50
  lazy: false
  use:
  - landing
  filter: ^(英国|德国|法国|荷兰|意大利|西班牙|葡萄牙|波兰|瑞典|瑞士|芬兰|挪威|丹麦|爱尔兰|奥地利|比利时|捷克|罗马尼亚|匈牙利|希腊|乌克兰|俄罗斯|爱沙尼亚|拉脱维亚|立陶宛|冰岛|卢森堡|保加利亚|克罗地亚|塞尔维亚|斯洛伐克|斯洛文尼亚)
- name: 🌐 全部节点
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 180
  timeout: 5000
  expected-status: 204
  tolerance: 50
  lazy: false
  use:
  - landing
