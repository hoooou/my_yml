name: 节点检测异常诊断
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 要诊断的完整全量检测运行编号
        type: string
        required: true
        default: '38040178745'
permissions:
  contents: read
  actions: read
concurrency:
  group: probe-audit-main
  cancel-in-progress: false
jobs:
  audit:
    name: 网站响应与TCP重复探测（不发布订阅）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 准备检测环境
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/install_tools.py --mihomo-only
          python -m unittest discover -s scripts/tests -v
      - name: 读取待诊断测试的输入与结果
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            exit 1
          fi
          gh run download "$SOURCE_RUN_ID" -n availability-input -D .node-work/audit-input
          gh run download "$SOURCE_RUN_ID" -n full-test-report -D .node-work/audit-report
      - name: 小样本诊断
        run: |
          python scripts/audit_probes.py --mihomo .node-work/bin/mihomo \
            --bundle .node-work/audit-input/bundle.json \
            --report .node-work/audit-report/full-test-report.json
      - name: 保存诊断结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: probe-audit
          path: .node-work/probe-audit/summary.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: 展示结果
        if: always()
        run: |
          if [ -f .node-work/probe-audit/summary.md ]; then
            cat .node-work/probe-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
