name: 已发布节点超时诊断
on:
  workflow_dispatch:
    inputs:
      current_ref:
        description: 当前订阅发布提交
        type: string
        required: true
        default: 'b75752f'
      previous_ref:
        description: 上一版订阅发布提交
        type: string
        required: true
        default: '793329f'
      tls_only:
        description: 只检查应用TLS及云端正常对照
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: published-diagnostics-main
  cancel-in-progress: false
jobs:
  diagnose:
    name: 前后两版节点复测（不发布订阅）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 准备检测环境
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/install_tools.py --mihomo-only
      - name: 复测已发布节点
        env:
          CURRENT_REF: ${{ inputs.current_ref }}
          PREVIOUS_REF: ${{ inputs.previous_ref }}
          TLS_ONLY: ${{ inputs.tls_only }}
        run: |
          tls_args=()
          if [ "$TLS_ONLY" = "true" ]; then
            tls_args+=(--tls-only)
          fi
          python scripts/published_diagnostics.py --mihomo .node-work/bin/mihomo \
            --current-ref "$CURRENT_REF" --previous-ref "$PREVIOUS_REF" "${tls_args[@]}"
      - name: 保存诊断结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-diagnostics
          path: .node-work/published-diagnostics/summary.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: 展示结果
        if: always()
        run: |
          if [ -f .node-work/published-diagnostics/summary.md ]; then
            cat .node-work/published-diagnostics/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
