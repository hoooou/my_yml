name: Hysteria2国内UDP诊断
on:
  workflow_run:
    workflows: ['每日节点连通性分类']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 已完成全量测试的运行编号
        type: string
        required: true
        default: '38042555519'
permissions:
  contents: read
  actions: read
concurrency:
  group: hysteria2-diagnostics-main
  cancel-in-progress: false
jobs:
  diagnose:
    name: 国内UDP与云端认证实连（不发布订阅）
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 读取全量来源与测量结果
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            exit 1
          fi
          ready="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false) | .name] | contains(["availability-input", "full-test-report"])')"
          if [ "$ready" != "true" ]; then
            echo "源运行没有未过期的全量输入与报告，跳过Hysteria2诊断。" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "$SOURCE_RUN_ID" -n availability-input -D .node-work/hy2-input
          gh run download "$SOURCE_RUN_ID" -n full-test-report -D .node-work/hy2-report
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: 准备检测环境
        if: steps.source.outputs.ready == 'true'
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/install_tools.py --mihomo-only
          python -m unittest discover -s scripts/tests -v
      - name: 原生QUIC与混淆小样本诊断
        if: steps.source.outputs.ready == 'true'
        run: |
          python scripts/hysteria2_diagnostics.py --mihomo .node-work/bin/mihomo \
            --bundle .node-work/hy2-input/bundle.json \
            --report .node-work/hy2-report/full-test-report.json
      - name: 保存结果
        if: always() && steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hysteria2-diagnostics
          path: .node-work/hysteria2-diagnostics/summary.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: 展示结果
        if: always()
        run: |
          if [ -f .node-work/hysteria2-diagnostics/summary.md ]; then
            cat .node-work/hysteria2-diagnostics/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
