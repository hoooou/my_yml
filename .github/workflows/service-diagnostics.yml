name: 补充服务小样本验证
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: service-diagnostics-main
  cancel-in-progress: false
jobs:
  inspect:
    name: ChatGPT API与FAST CDN（不发布订阅）
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 准备内核并检查逻辑
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/install_tools.py --mihomo-only
          python -m unittest discover -s scripts/tests -v
      - name: 验证服务及直连对照
        run: python scripts/service_diagnostics.py --mihomo .node-work/bin/mihomo
      - name: 保存脱敏结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-diagnostics
          path: .node-work/service-diagnostics/summary.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: 展示结果
        if: always()
        run: |
          if [ -f .node-work/service-diagnostics/summary.md ]; then
            cat .node-work/service-diagnostics/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
