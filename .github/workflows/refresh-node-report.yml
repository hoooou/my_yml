name: 刷新逐网站检测统计

on:
  workflow_run:
    workflows: [每日节点连通性分类]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: select-nodes-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 读取可信主分支当前发布结果
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 安装报告依赖
        run: python -m pip install -r scripts/requirements.txt
      - name: 仅用当前已发布证据补全报告
        run: python scripts/refresh_detection_report.py
      - name: 发布报告，不改订阅节点
        run: python scripts/publish_subscription.py --report-only
