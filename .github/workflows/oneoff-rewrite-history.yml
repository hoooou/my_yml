name: 一次性改写提交历史

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    name: 抹掉旧身份并从历史移除大 JSON
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 读取完整历史
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 备份成 bundle
        run: git bundle create /tmp/pre-rewrite.bundle --all

      - name: 保存备份附件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pre-rewrite-bundle
          path: /tmp/pre-rewrite.bundle
          retention-days: 7
          if-no-files-found: error

      - name: 暂存要保留的当前版本
        run: |
          mkdir -p /tmp/keep
          for f in 最新检测.json 连通性报告.json 测速报告.json 移动小测报告.json; do
            cp "$f" "/tmp/keep/$f"
          done

      - name: 安装 git-filter-repo
        run: python3 -m pip install --quiet git-filter-repo

      - name: 改写作者并从历史里移除大 JSON
        run: |
          cat > /tmp/mailmap.txt <<'EOF'
          hoooou <hoooou@users.noreply.github.com> 侯秀凯 <houxk@yiche.com>
          hoooou <hoooou@users.noreply.github.com> hoooou <972321224@qq.com>
          EOF
          git filter-repo --force --mailmap /tmp/mailmap.txt \
            --invert-paths \
            --path 最新检测.json \
            --path 连通性报告.json \
            --path 测速报告.json \
            --path 移动小测报告.json

      - name: 把当前版本按单次提交放回
        run: |
          cp /tmp/keep/* .
          git add -A
          git -c user.name="hoooou" -c user.email="hoooou@users.noreply.github.com" \
            commit -m "reports: 只保留当前版本，历史里的大 JSON 已移除" || true

      - name: 强推 main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin HEAD:main
