name: 中国移动小规模对照测试

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: select-nodes-main
  cancel-in-progress: false

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 读取仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 安装依赖与工具
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/install_tools.py
      - name: 检查筛选与未知结果处理
        run: python -m unittest discover -s scripts/tests -v
      - name: 20 节点移动入口、网站及默认文件测速
        run: |
          python scripts/mobile_pilot.py \
            --mihomo .node-work/bin/mihomo --speedtest .node-work/bin/clash-speedtest
      - name: 发布到原订阅地址
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 优选配置.yaml 移动小测报告.json 移动小测报告.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish China Mobile comparison subscription"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: 发布对照摘要
        run: cat 移动小测报告.md >> "$GITHUB_STEP_SUMMARY"
