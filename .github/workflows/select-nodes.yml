name: 每日节点连通性分类

on:
  schedule:
    # GitHub uses UTC: 00:00 UTC = 08:00 Asia/Shanghai.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: select-nodes-main
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: 读取仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装依赖与内核
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/install_tools.py --mihomo-only

      - name: 检查筛选逻辑
        run: python -m unittest discover -s scripts/tests -v

      - name: 全量 TCP 分类、通过节点网页三轮复测
        run: python scripts/availability.py --mihomo .node-work/bin/mihomo

      - name: 更新配置和报告
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 优选配置.yaml 连通性报告.json 连通性报告.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update TCP classification $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 发布本次摘要
        run: cat 连通性报告.md >> "$GITHUB_STEP_SUMMARY"
