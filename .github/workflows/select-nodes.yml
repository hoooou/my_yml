name: 每日节点连通性分类

on:
  schedule:
    # GitHub uses UTC: 00:00 UTC = 08:00 Asia/Shanghai.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 全量检测、重建配置、海外请求复测或Claude独立诊断
        type: choice
        required: true
        default: full
        options: [full, repair, web-recheck, claude-diagnostics]
      diagnostic_run_id:
        description: Claude诊断使用的已完成全量检测运行编号（仅诊断模式使用）
        type: string
        required: false
        default: '38040178745'

permissions:
  contents: read

concurrency:
  group: select-nodes-main
  cancel-in-progress: false

jobs:
  prepare:
    name: 获取全量订阅并去重
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 读取仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 安装依赖与内核
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/install_tools.py --mihomo-only
      - name: 检查并行与分类逻辑
        run: python -m unittest discover -s scripts/tests -v
      - name: 诊断 Amazon 网页样本
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/probe_page_diagnostics.py --mihomo .node-work/bin/mihomo
      - name: 保存 Amazon 诊断结果
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amazon-page-diagnostics
          path: .node-work/page-diagnostics/summary.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn
      - name: 获取节点并检查配置
        run: python scripts/availability.py --mihomo .node-work/bin/mihomo --phase prepare
      - name: 保存本轮共同输入
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: availability-input
          path: .node-work/availability/bundle.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  probe:
    name: 204 → TCP → 网站 → 1MB → 50MB（分片 ${{ matrix.shard }}）
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: 读取仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 安装依赖与内核
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/install_tools.py --mihomo-only
      - name: 读取本轮共同输入
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: availability-input
          path: .node-work/availability
      - name: 按阶段并行检测节点
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: python scripts/availability.py --mihomo .node-work/bin/mihomo --phase probe --shard-index "$SHARD_INDEX" --shard-count 4
      - name: 保存分片结果
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: availability-shard-${{ matrix.shard }}
          path: .node-work/availability/shard-*.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  publish:
    name: 合并校验并更新原订阅
    needs: [prepare, probe]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 读取仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 安装依赖与内核
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/install_tools.py --mihomo-only
      - name: 读取本轮共同输入
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: availability-input
          path: .node-work/availability
      - name: 读取四个分片
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: availability-shard-*
          merge-multiple: true
          path: .node-work/shards
      - name: 检查全量结果并生成订阅
        env:
          IPAPI_IS_KEY: ${{ secrets.IPAPI_IS_KEY }}
        run: python scripts/availability.py --mihomo .node-work/bin/mihomo --phase publish --shard-count 4
      - name: 保存本次全量检测报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-test-report
          path: .node-work/availability/full-test-report.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: 展示本次全量检测结果
        if: always()
        run: |
          if [ -f .node-work/availability/full-test-report.md ]; then
            cat .node-work/availability/full-test-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 更新配置和报告
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 优选配置.yaml 连通性报告.json 连通性报告.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update TCP classification $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: 发布本次摘要
        run: |
          if [ -f .node-work/availability/selected.yaml ]; then
            cat 连通性报告.md >> "$GITHUB_STEP_SUMMARY"
          fi

  repair:
    name: 修复手机兼容性并更新原订阅
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'repair' || inputs.mode == 'web-recheck')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 读取仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 安装依赖与内核
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/install_tools.py --mihomo-only
      - name: 检查手机兼容性逻辑
        run: python -m unittest discover -s scripts/tests -v
      - name: 修复已有结果并验证订阅
        env:
          IPAPI_IS_KEY: ${{ secrets.IPAPI_IS_KEY }}
          UPDATE_MODE: ${{ inputs.mode }}
        run: |
          if [ "$UPDATE_MODE" = "web-recheck" ]; then
            python scripts/availability.py --mihomo .node-work/bin/mihomo --phase web-recheck
          else
            python scripts/availability.py --mihomo .node-work/bin/mihomo --phase repair --refresh-ip-reputation
          fi
      - name: 更新原订阅与报告
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 优选配置.yaml 连通性报告.json 连通性报告.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Repair mobile YAML compatibility $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: 保存网站专项复测记录
        if: always() && inputs.mode == 'web-recheck'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-quality-recheck
          path: .node-work/availability/web-recheck-results.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn
      - name: 发布修复摘要
        run: cat 连通性报告.md >> "$GITHUB_STEP_SUMMARY"

  claude-diagnostics:
    name: Claude首页与普通浏览器对照诊断
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'claude-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: 读取仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 准备诊断环境
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m pip install playwright==1.55.0
          python scripts/install_tools.py --mihomo-only
          if ! command -v google-chrome >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
          python -m unittest discover -s scripts/tests -p test_claude_diagnostics.py -v
      - name: 读取原全量测试的输入与结果
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIAGNOSTIC_RUN_ID: ${{ inputs.diagnostic_run_id }}
        run: |
          if ! [[ "$DIAGNOSTIC_RUN_ID" =~ ^[0-9]+$ ]]; then
            exit 1
          fi
          gh run download "$DIAGNOSTIC_RUN_ID" -n availability-input -D .node-work/diagnostic-input
          gh run download "$DIAGNOSTIC_RUN_ID" -n full-test-report -D .node-work/diagnostic-report
      - name: 小样本对照首页、UA、HTTP版本和普通浏览器
        run: |
          python scripts/claude_diagnostics.py --mihomo .node-work/bin/mihomo \
            --bundle .node-work/diagnostic-input/bundle.json \
            --report .node-work/diagnostic-report/full-test-report.json
      - name: 保存诊断结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-diagnostics
          path: .node-work/claude-diagnostics/summary.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: 展示诊断结果
        if: always()
        run: |
          if [ -f .node-work/claude-diagnostics/summary.md ]; then
            cat .node-work/claude-diagnostics/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
