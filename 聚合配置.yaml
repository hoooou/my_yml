# 手机分流：公司域名使用公司 DNS；国内直连，海外服务优先代理
mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: false
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fallback:
  - https://1.1.1.1/dns-query#🚀 全局选择
  - https://8.8.8.8/dns-query#🚀 全局选择
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    +.tech.bitauto.com:
    - 192.168.70.49
    - 192.168.70.1
    +.yiche.com:
    - 192.168.70.49
    - 192.168.70.1
    +.bitauto.com:
    - 192.168.70.49
    - 192.168.70.1
    +.bitautotech.com:
    - 192.168.70.49
    - 192.168.70.1
    rule-set:company-internal:
    - 192.168.70.49
    - 192.168.70.1
    rule-set:overseas-services:
    - https://1.1.1.1/dns-query#🚀 全局选择
    - https://8.8.8.8/dns-query#🚀 全局选择
    rule-set:proxy:
    - https://1.1.1.1/dns-query#🚀 全局选择
    - https://8.8.8.8/dns-query#🚀 全局选择
    rule-set:gfw:
    - https://1.1.1.1/dns-query#🚀 全局选择
    - https://8.8.8.8/dns-query#🚀 全局选择
    rule-set:domestic-services:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    rule-set:direct:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    rule-set:private:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.msftconnecttest.com
  - +.msftncsi.com
  - +.tech.bitauto.com
  - +.yiche.com
  - +.bitauto.com
  - +.bitautotech.com
  - rule-set:company-internal
  direct-nameserver-follow-policy: true
