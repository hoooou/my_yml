# 每日从固定分支地址读取最新 YAML；只导入 proxies，不采用来源的规则或分组。
sources:
- id: bestclash
  enabled: true
  repository: https://github.com/PuddinCat/BestClash
  url: https://raw.githubusercontent.com/PuddinCat/BestClash/main/proxies.yaml
- id: au1rxx
  enabled: true
  repository: https://github.com/Au1rxx/free-vpn-subscriptions
  url: https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml
- id: anaer
  enabled: true
  repository: https://github.com/anaer/Sub
  url: https://raw.githubusercontent.com/anaer/Sub/main/clash.yaml
- id: automerge
  enabled: true
  repository: https://github.com/chengaopan/AutoMergePublicNodes
  url: https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.yml
- id: eternity
  enabled: true
  repository: https://github.com/mahdibland/V2RayAggregator
  url: https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/Eternity.yml
- id: zhuhaiuk
  enabled: true
  repository: https://github.com/zhuhaiuk/free-nodes
  url: https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/clash_config.yaml
